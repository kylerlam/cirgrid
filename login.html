<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fa">
  <title data-i18n="Sign in">CirGrid — Sign in</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/themes.css">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/account.css">
  <script type="module" src="/src/login.js"></script>
</head>
<body>
  <header class="login-header">
    <a class="brand" href="/"><img src="/assets/icon.svg" alt="" width="36" height="36">CirGrid</a>
    <button id="open-settings" class="button button-secondary" type="button" data-i18n="Settings">Settings</button>
  </header>
  <main class="login-main">
    <section class="tracker-panel login-panel" aria-labelledby="login-title">
      <h1 id="login-title" data-i18n="Sign in to CirGrid">Sign in to CirGrid</h1>
      <p class="login-subtitle" data-i18n="Your private habit tracker.">Your private habit tracker.</p>
      <form id="login-form" class="account-form">
        <label><span data-i18n="Username">Username</span><input name="username" autocomplete="username" required maxlength="64"></label>
        <label><span data-i18n="Password">Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="256"></label>
        <button class="button button-primary" type="submit" data-i18n="Sign in" disabled>Sign in</button>
      </form>
      <p id="login-error" class="account-message" role="alert" hidden></p>
      <section id="default-credentials" class="default-credentials" aria-labelledby="first-sign-in-title" hidden>
        <h2 id="first-sign-in-title" data-i18n="First sign-in">First sign-in</h2>
        <dl>
          <dt data-i18n="Username">Username</dt><dd><code id="default-username"></code></dd>
          <dt data-i18n="Password">Password</dt><dd><code id="default-password"></code></dd>
        </dl>
        <p data-i18n="After signing in, change your password in Settings → Account.">After signing in, change your password in Settings → Account.</p>
      </section>
    </section>
  </main>
</body>
</html>
